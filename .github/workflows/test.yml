name: Test

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: go test (${{ matrix.go }})
    runs-on: [ self-hosted, jamf-ubuntu-latest ]
    strategy:
      fail-fast: false
      matrix:
        # 1.13 is the go.mod minimum, 1.21 is what jamf-pro-server-tools builds with.
        go: [ '1.13', '1.21', 'stable' ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet .
      - run: go test -cover -coverprofile=cover.out .
